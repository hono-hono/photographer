name: Deploy to GitHub Pages

# 動くきっかけ（設計書 10章）
# - main に push したとき（コードの変更）
# - Kuroco で作品・実績・プロフィールを保存したとき（Kuroco の GitHub 連携が workflow_dispatch でこのワークフローを動かす）
# - 手動実行（Actions の画面から。待ち時間を 0 にするとすぐ始まる）
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wait:
        description: "ビルドを始める前に待つ秒数（Kuroco で続けて保存したときに1回にまとめるため）"
        required: false
        default: "90"
  repository_dispatch:
    types: [kuroco_update]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 続けて保存したときは、古いビルドを取り消して最新の1回だけにまとめる
    concurrency:
      group: build
      cancel-in-progress: true
    steps:
      - name: Wait for more updates from Kuroco
        # 何枚もまとめて登録するとき、保存のたびにビルドが走らないよう少し待つ（その間に次の保存が来たらこの回は取り消される）
        if: github.event_name != 'push'
        env:
          WAIT: ${{ github.event.inputs.wait || '90' }}
        run: |
          case "$WAIT" in ''|*[!0-9]*) WAIT=90 ;; esac
          sleep "$WAIT"

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # 縮小済みの写真を前回のビルドから引き継ぐ（変わっていない写真は処理を飛ばす）
      - name: Restore resized photos
        uses: actions/cache@v4
        with:
          path: |
            public/photos
            .content/images.json
          key: photos-${{ github.run_id }}
          restore-keys: photos-

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /photographer
          KUROCO_API_TOKEN: ${{ secrets.KUROCO_API_TOKEN }}
          # トークンがないときはダミーで公開せず、ビルドを止める
          KUROCO_REQUIRED: "true"
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
